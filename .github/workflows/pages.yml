name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: ''
      PUBLIC_SUPABASE_ANON_KEY: ''
      PUBLIC_VAPID_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --no-audit --no-fund
      - name: Check Supabase Edge Functions
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts
      - name: Check Svelte and TypeScript
        shell: bash
        run: |
          set +e
          output="$(npm run check 2>&1)"
          result=$?
          printf '%s\n' "$output"
          if [ "$result" -ne 0 ]; then
            {
              printf '### npm run check output\n\n```text\n'
              printf '%s\n' "$output" | tail -n 120
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$output" | tail -n 80 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$result"
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:supabase
      - name: Build static site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_VAPID_KEY: ${{ secrets.PUBLIC_VAPID_KEY }}
        run: npm run build
      - name: Check Pages entry point
        run: test -s build/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
